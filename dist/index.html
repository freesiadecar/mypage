<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6fa">
  <meta name="description" content="个人工具导航，快速进入工作项目与游戏资料库。">
  <title>我的工具箱</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #172033;
      background: #f4f6fa;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --muted: #68738a;
      --line: #e3e8f0;
    }

    * { box-sizing: border-box; }
    body { min-width: 320px; margin: 0; }
    a { color: inherit; }

    .shell { width: min(1080px, calc(100% - 48px)); margin: 0 auto; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 88px;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 11px;
      background: #19243a;
      color: #c9f36b;
      font-size: 18px;
      font-weight: 800;
    }
    .brand-name { font-size: 15px; font-weight: 750; letter-spacing: .02em; }
    .brand-note { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .top-label { color: #798398; font-size: 13px; }

    main { padding: 74px 0 58px; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #617086;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      width: 18px;
      height: 2px;
      background: #92c83e;
      content: "";
    }
    h1 {
      max-width: 700px;
      margin: 20px 0 14px;
      color: #172033;
      font-size: clamp(38px, 6vw, 64px);
      font-weight: 760;
      letter-spacing: -.055em;
      line-height: 1.13;
    }
    .intro { max-width: 540px; margin: 0; color: var(--muted); font-size: 17px; line-height: 1.8; }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      margin: 62px 0 18px;
    }
    .section-label { margin: 0 0 7px; color: #7a8498; font-size: 12px; font-weight: 700; letter-spacing: .12em; }
    h2 { margin: 0; font-size: 22px; letter-spacing: -.03em; }
    .connected { color: #737e92; font-size: 13px; }
    .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .tool-card {
      position: relative;
      display: flex;
      min-height: 270px;
      flex-direction: column;
      overflow: hidden;
      padding: 25px 26px 23px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #fff;
      text-decoration: none;
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }
    .tool-card:hover { transform: translateY(-3px); border-color: #c8d3e3; box-shadow: 0 16px 38px #253b5e12; }
    .tool-card:focus-visible, .brand:focus-visible { outline: 3px solid #92c83e; outline-offset: 4px; }
    .card-top { display: flex; align-items: center; justify-content: space-between; }
    .icon {
      display: grid;
      width: 50px;
      height: 50px;
      place-items: center;
      border-radius: 15px;
    }
    .work .icon { background: #e8eefb; color: #3559a6; }
    .games .icon { background: #edf7dd; color: #547c22; }
    .icon svg { width: 25px; height: 25px; }
    .connected-pill {
      padding: 6px 10px;
      border: 1px solid #e6eaf0;
      border-radius: 999px;
      color: #647087;
      font-size: 12px;
    }
    .card-copy { margin-top: 25px; }
    .card-copy h3 { margin: 0 0 8px; font-size: 23px; letter-spacing: -.035em; }
    .card-copy p { max-width: 370px; margin: 0; color: var(--muted); font-size: 15px; line-height: 1.7; }
    .card-action {
      display: flex;
      align-items: center;
      margin-top: auto;
      padding-top: 23px;
      color: #33425a;
      font-size: 14px;
      font-weight: 700;
    }

    footer {
      display: flex;
      justify-content: space-between;
      padding: 20px 0 28px;
      border-top: 1px solid var(--line);
      color: #8791a3;
      font-size: 12px;
    }

    @media (max-width: 640px) {
      .shell { width: min(100% - 32px, 460px); }
      .topbar { min-height: 72px; }
      main { padding: 53px 0 42px; }
      h1 { font-size: clamp(38px, 11vw, 52px); }
      .intro { font-size: 16px; }
      .section-head { margin-top: 46px; }
      .cards { grid-template-columns: 1fr; gap: 13px; }
      .tool-card { min-height: 250px; padding: 22px; }
      footer { gap: 12px; flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="我的工具箱首页">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span>
          <span class="brand-name">我的工具箱</span>
          <span class="brand-note">个人工作台</span>
        </span>
      </a>
      <span class="top-label">常用入口</span>
    </header>

    <main>
      <section aria-labelledby="welcome-title">
        <span class="eyebrow">Personal hub</span>
        <h1 id="welcome-title">常用工具，<br>从这里开始。</h1>
        <p class="intro">把工作项目和游戏资料放在一个入口，打开就能继续。</p>
      </section>

      <section aria-labelledby="tools-title">
        <div class="section-head">
          <div>
            <p class="section-label">我的空间</p>
            <h2 id="tools-title">工具导航</h2>
          </div>
          <span class="connected">2 个入口</span>
        </div>

        <div class="cards">
          <a class="tool-card work" href="https://project-compass-9x7.team-2979.chatgpt.site" target="_blank" rel="noopener noreferrer">
            <span class="card-top">
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3.5" y="7" width="17" height="13" rx="2.5"></rect>
                  <path d="M8.5 7V5.5A1.5 1.5 0 0 1 10 4h4a1.5 1.5 0 0 1 1.5 1.5V7M3.5 12h17M10 12v2h4v-2"></path>
                </svg>
              </span>
              <span class="connected-pill">已连接</span>
            </span>
            <span class="card-copy">
              <h3>工作项目</h3>
              <p>集中进入项目空间，查看计划与进展。</p>
            </span>
            <span class="card-action">打开项目罗盘</span>
          </a>

          <a class="tool-card games" href="https://worldbook-atelier.jijiguai56.chatgpt.site" target="_blank" rel="noopener noreferrer">
            <span class="card-top">
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 4.5h10.5A3.5 3.5 0 0 1 19 8v11.5H8A3 3 0 0 1 5 16.5z"></path>
                  <path d="M5 16.5A2.5 2.5 0 0 1 7.5 14H19M9 8h6M9 10.5h4"></path>
                </svg>
              </span>
              <span class="connected-pill">已连接</span>
            </span>
            <span class="card-copy">
              <h3>游戏资料库</h3>
              <p>打开资料库，继续浏览和整理游戏内容。</p>
            </span>
            <span class="card-action">打开 Worldbook</span>
          </a>
        </div>
      </section>
    </main>

    <footer>
      <span>MY PAGE · 个人工具导航</span>
      <span>两个入口，一个起点</span>
    </footer>
  </div>
</body>
</html>
