<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fb">
  <meta name="description" content="个人工作台：管理工作项目、任务和游戏资料。">
  <title>我的工作台</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="supabase-config.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="auth-screen" id="auth-root" hidden></main>
  <div class="app-shell" id="workspace-shell" hidden>
    <aside class="sidebar">
      <a class="brand" href="#/home" aria-label="我的工作台，首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3.5v17M3.5 12h17M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
        </span>
        <span class="brand-copy"><strong>我的工作台</strong><small>PERSONAL WORKSPACE</small></span>
      </a>

      <div class="workspace-card">
        <span class="workspace-icon" aria-hidden="true">我</span>
        <span><strong>我的工作空间</strong><small>个人空间</small></span>
        <span class="workspace-caret" aria-hidden="true">⌄</span>
      </div>

      <nav class="sidebar-nav" aria-label="主导航">
        <p class="nav-label">个人工具</p>
        <a class="nav-link" href="#/home" data-nav="home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10 8.5-6.5 8.5 6.5v9a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19z"/><path d="M9 20.5v-7h6v7"/></svg>
          <span>首页</span>
        </a>
        <p class="nav-label">工作空间</p>
        <a class="nav-link" href="#/overview" data-nav="overview">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
          <span>工作项目</span>
        </a>
        <a class="nav-link" href="#/projects" data-nav="projects">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h4l2 2h6A2.5 2.5 0 0 1 20.5 9.5v8A2.5 2.5 0 0 1 18 20H6a2.5 2.5 0 0 1-2.5-2.5z"/><path d="M3.5 10h17"/></svg>
          <span>我的项目</span>
        </a>
        <a class="nav-link" href="#/tasks" data-nav="tasks">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 6 1.5 1.5L9 5M12 7h7M5 12l1.5 1.5L9 11M12 13h7M5 18l1.5 1.5L9 17M12 19h7"/></svg>
          <span>所有任务</span>
          <span class="nav-count" id="nav-task-count">0</span>
        </a>
        <p class="nav-label nav-label-library">资料库</p>
        <a class="nav-link" href="#/games" data-nav="games">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h10A3.5 3.5 0 0 1 18.5 8v11H8A3 3 0 0 1 5 16z"/><path d="M5 16a2.5 2.5 0 0 1 2.5-2.5h11M9 8h6M9 10.5h4"/></svg>
          <span>游戏开发资料库</span>
        </a>
      </nav>

      <div class="sidebar-bottom">
        <div class="focus-note">
          <strong>专注当下，稳步向前</strong>
          <p>把想法变成行动，让每一步都有迹可循。</p>
        </div>
        <div class="profile-row"><span class="profile-avatar">云</span><span><strong id="profile-email">我的工作空间</strong><small>云端同步</small></span></div>
      </div>
    </aside>

    <div class="main-shell">
      <header class="topbar">
        <div class="breadcrumbs"><span>工作空间</span><span class="crumb-separator">/</span><strong id="breadcrumb-title">总览</strong></div>
        <div class="topbar-right"><span class="save-indicator"><i id="save-dot" aria-hidden="true"></i><span id="save-label">连接云端…</span></span><div class="topbar-actions"><button class="button small" type="button" data-action="import-data">导入 JSON</button><button class="button small" type="button" data-action="export-data">导出备份</button><button class="button small danger" type="button" data-action="sign-out">退出登录</button></div><span class="top-avatar" aria-label="个人空间">我</span></div>
      </header>
      <main class="page-content" id="app" tabindex="-1"></main>
    </div>
  </div>

  <input id="data-import-file" type="file" accept=".json,.txt,application/json,text/plain" hidden>
  <dialog class="entry-dialog" id="entry-dialog" aria-labelledby="dialog-title"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
<!-- Trigger GitHub Pages deployment -->
